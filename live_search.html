<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live User Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f2f5;
      padding: 2rem 1rem;
    }

    .search-bar {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    .user-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .user-card {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      width: 260px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #result-count {
      color: #555;
      font-size: 0.9rem;
    }
    #status {
      color: #555;
      margin: 1rem 0;
    }

    .user-card h3 {
      color: #1e293b;
      margin-bottom: 0.75rem;
    }

    .user-card p {
      color: #475569;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <h1 style="text-align:center; margin-bottom: 1rem;">User Directory</h1>

  <input
    type="search"
    class="search-bar"
    id="search-input"
    placeholder="Search by name or email…"
  />

  <p id="result-count" style="text-align:center; margin-bottom:1rem;"></p>
  <div id="status" style="text-align:center;">Loading users…</div>
  <div class="user-grid" id="user-grid"></div>

  <script>
  let allUsers = [];

    const searchInput = document.querySelector('#search-input');
    const resultCount = document.querySelector('#result-count');
    const statusDiv   = document.querySelector('#status');
    const userGrid    = document.querySelector('#user-grid');

    async function fetchUsers() {
        try {
            //Request users from the API
            const response = await fetch(
                "https://jsonplaceholder.typicode.com/users"
            );
            //Check for an HTTP error
            if (!response.ok) {
                throw new Error(`Server returned ${response.status}`);
            }
            //Convert the JSON response into JS data
            allUsers = await response.json();

            //Hide the loading message
            statusDiv.style.display = "none";

            //Display the users
            renderUsers(allUsers);

      } catch (err) {
            //Show an error if something went wrong
            statusDiv.textContent = `Unable to load users: ${err.message}`;

      } finally {
          console.log("Fetch attempt completed.");
 
      }
    }

    function renderUsers(users) {
        //Update the result count
        resultCount.textContent =
            `Showing ${users.length} of ${allUsers.length} users`;

        //Clear the previous cards
        userGrid.innerHTML = "";

        //Handle no matching results
        if(users.length === 0) {
          userGrid.textContent = "No users found.";
          return;
        }

        //Create one card for each user
        users.forEach(function (user){

            const card = document.createElement("div");
            card.className = "user-card";

            const name = document.createElement("h3");
            name.textContent = user.name;

            const email = document.createElement("p");
            email.textContent = user.email;

            const company = document.createElement("p");
            company.textContent = `Company: ${user.company.name}`;

            const city = document.createElement("p");
            city.textContent = `City: ${user.address.city}`;

            card.appendChild(name);
            card.appendChild(email);
            card.appendChild(company);
            card.appendChild(city);
            //Clear the old cards
            userGrid.appendChild(card);

        });
    }

    searchInput.addEventListener("input", function () {
        console.log("Search event fired!");
      //Read the search text
      const query = searchInput.value.toLowerCase().trim();

      console.log("Search query:", query);

      //If the search is empty, display everyone
      if (query === "") {
          renderUsers(allUsers);
          return;
      }

      //Find matching users
      const filteredUsers = allUsers.filter(function (user) {

        return(
            user.name.toLowerCase().includes(query) || user.email.toLowerCase().includes(query)
        );
      });

      console.log("Matching users:", filteredUsers.length);
      // Display matching users
      renderUsers(filteredUsers);
    });
//Start loading usrs when the page opens
    fetchUsers();
  </script>

</body>
</html>
